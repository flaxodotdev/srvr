name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static musl binaries run on any distro
          - { target: x86_64-unknown-linux-musl,      os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl,     os: ubuntu-latest }
          - { target: armv7-unknown-linux-musleabihf, os: ubuntu-latest }
          - { target: i686-unknown-linux-musl,        os: ubuntu-latest }
          - { target: x86_64-unknown-linux-gnu,       os: ubuntu-latest }
          # BSD
          - { target: x86_64-unknown-freebsd,         os: ubuntu-latest }
          # macOS
          - { target: x86_64-apple-darwin,            os: macos-latest }
          - { target: aarch64-apple-darwin,           os: macos-latest }
          # Windows
          - { target: x86_64-pc-windows-msvc,         os: windows-latest }
          - { target: aarch64-pc-windows-msvc,        os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release"
          strip: true

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name=srvr-${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/srvr dist/
          cp README.md LICENSE dist/
          tar -czf $name.tar.gz -C dist srvr README.md LICENSE
          if command -v sha256sum >/dev/null; then sha256sum $name.tar.gz > $name.tar.gz.sha256
          else shasum -a 256 $name.tar.gz > $name.tar.gz.sha256; fi

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "srvr-${{ matrix.target }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/srvr.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: srvr-${{ matrix.target }}
          path: |
            srvr-${{ matrix.target }}.*

  release:
    needs: build
    # Publish whatever built, even if an exotic target failed.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
