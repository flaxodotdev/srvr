[package]
name = "srvr"
version = "0.1.0"
edition = "2024"
description = "A terminal UI to see, manage and launch the servers running on your machine"
license = "MIT"
readme = "README.md"
repository = "https://github.com/flaxodotdev/srvr"
homepage = "https://github.com/flaxodotdev/srvr"
keywords = ["tui", "server", "ports", "devtools", "localhost"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
dirs = "7.0.0"
listeners = "0.6.1"
open = "5.4.5"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
sysinfo = "0.40.4"
which = "8.0.6"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
